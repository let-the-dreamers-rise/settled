[workspace]
# Resolver 3 picks dependency versions that support `rust-version`, so the pinned 1.86
# toolchain (the wasm the NEAR runtime accepts) keeps building.
resolver = "3"
members = ["contracts/settled", "contracts/mock-ft"]

[workspace.package]
rust-version = "1.86"

[workspace.dependencies]
near-sdk = "=5.6.0"
near-contract-standards = "=5.6.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
